[package]
name = "murmur-dashboard"
version = "1.9.0"
description = "Murmur Dashboard"
authors = ["sleepti3ht"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
