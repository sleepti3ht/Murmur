# dashboard/tauri/Cargo.toml
[package]
name = "murmur-dashboard"
version = "1.9.0"
description = "Murmur Dashboard"
authors = ["sleepti3ht"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Добавлена фича "tray-icon"
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
