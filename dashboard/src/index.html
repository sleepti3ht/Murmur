<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murmur Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">🌑 Murmur Dashboard</div>
            <div class="header-actions">
                <button id="theme-toggle" class="btn-secondary">Toggle Theme</button>
            </div>
        </header>

        <nav class="tabs">
            <button class="tab-btn active" data-tab="findings">Findings</button>
            <button class="tab-btn" data-tab="rules">Custom Rules (v1.8)</button>
        </nav>

        <!-- Stats Cards -->
        <div class="stats-grid" id="stats-container">
            <div class="stat-card">
                <div class="stat-label">Total Findings</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">High Confidence</div>
                <div class="stat-value text-danger" id="stat-high">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Scans Today</div>
                <div class="stat-value" id="stat-scans">0</div>
            </div</div>

        <!-- Findings Tab -->
        <div id="tab-findings" class="tab-content active">
            <div class="card">
                <div class="card-header">
                    <h2>Recent Findings</h2>
                    <select id="confidence-filter" class="select-input">
                        <option value="all">All Confidences</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Confidence</th>
                            <th>Repository</th>
                            <th>File</th>
                            <th>Rule</th>
                            <th>Mask</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="findings-body"></tbody>
                </table>
            </div>
        </div>

        <!-- Custom Rules Tab -->
        <div id="tab-rules" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <h2>Custom Detection Rules</h2>
                    <button class="btn-primary">+ Add Rule</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Rule ID</th>
                            <th>Pattern</th>
                            <th>Severity</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="rules-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
